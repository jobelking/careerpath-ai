services:
  - type: web
    name: careerpath-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerpath-ai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_KEY_2
        sync: false
      - key: RAPIDAPI_KEY_3
        sync: false
      - key: RAPIDAPI_KEY_4
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.titan.email
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: careerpath-ai-db
    databaseName: careerpathai_db
    user: careerpathai
    plan: free
